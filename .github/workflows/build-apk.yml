name: Build Android APK (No Laptop Needed)

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Your Live Railway or Hosted App URL (e.g. https://your-app.up.railway.app)'
        required: false
        default: 'https://rha-volunteers.up.railway.app'
  push:
    branches: [ main ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Web Production Assets
        run: npm run build

      - name: Configure Live Server URL
        env:
          LIVE_URL: ${{ github.event.inputs.live_url || 'https://rha-volunteers.up.railway.app' }}
        run: |
          echo "Targeting live URL: $LIVE_URL"
          node -e "
            const fs = require('fs');
            const cfgPath = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
            if (process.env.LIVE_URL) {
              cfg.server = cfg.server || {};
              cfg.server.url = process.env.LIVE_URL;
              cfg.server.cleartext = true;
              fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2));
              console.log('Updated capacitor.config.json with live server:', process.env.LIVE_URL);
            }
          "
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RHA-volunteers-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
